# Alembic configuration.
# NOTE: keep this file ASCII-only. configparser on Windows reads it with the
# system locale encoding (GBK), so non-ASCII characters break it.
#
#   cd backend
#   alembic upgrade head                       # create tables
#   alembic revision --autogenerate -m "..."   # generate a migration
#   alembic downgrade -1                       # roll back one step
#
# The database URL is NOT hardcoded here -- alembic/env.py reads it from
# app.config.settings so that the app and the migrations always agree.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
